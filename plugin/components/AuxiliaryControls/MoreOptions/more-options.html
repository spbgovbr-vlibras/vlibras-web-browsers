<div class="vp-more-options-container">
  <div class="vp-more-options-header">
    <span>Mais opções</span>
    <button aria-label="Fechar" type="button"></button>
  </div>

  <div class="vp-more-options-content">
    <div class="vp-more-option">
      <button
        class="vp-translator-button"
        type="button"
        aria-label="Traduzir para Libras"
      ></button>
      <span>Tradutor</span>
    </div>

    <div
      class="vp-more-option"
      type="button"
      aria-label="Alterar expressão facial do avatar"
    >
      <button class="vp-emotions-button"></button>
      <span>Emoções</span>
    </div>

    <div class="vp-more-option">
      <button
        class="vp-other-resources-button"
        type="button"
        aria-label="Outros recursos assistivos"
      ></button>
      <span>Outros<br />Recursos</span>
    </div>
  </div>
</div>
