<div class="vpw-loading-dictionary">
    <div>
        <span class="vpw-loading__img"></span>
        <span class="vpw-dict-msg--loading">
            Carregando<br>
            Dicionário
        </span>
        <span class="vpw-dict-msg--error">
            Falha no<br>
            Carregamento
        </span>
        <span class="vpw-dict-msg--max-request">
            Desculpe,<br>
            algo saiu errado.
        </span>
        <button>Tentar novamente</button>
    </div>
</div>

<div class="vpw-panel">
    <div class="vpw-bar">
        <button class="vpw-btn-close"></button>
        <span class="vpw-title">Dicionário</span>
    </div>

    <div class="vpw-search">
        <input type="text" placeholder="Digite um sinal para pesquisar">
        <span class="vpw-icon"></span>
    </div>
</div>

<div class="vpw-buttons-container">
    <button class="vp-dictionary-btn vp-selected" data-tab="categories">Categorias</button>
    <button class="vp-dictionary-btn" data-tab="az">A-Z</button>
    <button class="vp-dictionary-btn" data-tab="recents">Recentes</button>
</div>

<div class="vpw-categories-header">
    <button class="vpw-btn-back"></button>
    <span class="vpw-category-header-icon"></span>
    <span class="vpw-category-title"></span>
</div>

<div class="vpw-categories-container vp-enabled">
    <ul class="vpw-categories-list"></ul>
    <ul class="vpw-category-signs-list"></ul>
    <span class="vpw-empty-message">Nenhum sinal encontrado</span>
</div>

<div class="vpw-recents-container vp-isEmpty">
    <ul></ul>
    <span>Nenhuma tradução recente foi feita</span>
</div>

<div class="vpw-dict-container">
    <div class="vpw-az-accordion"></div>
    <div class="vpw-az-search-results" style="display: none;">
        <ul></ul>
        <span></span>
    </div>
</div>
